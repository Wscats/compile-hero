name: CI & Publish

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Bundle
        run: pnpm bundle

  publish:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Bundle for production
        run: pnpm bundle

      - name: Publish to VSCode Marketplace
        run: pnpm exec vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
